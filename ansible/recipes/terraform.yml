---
# Terraform via HashiCorp's official apt repo
- name: Install prerequisites for HashiCorp repo
  apt:
    name: [gnupg, software-properties-common, curl]
    state: present
    update_cache: yes

- name: Add HashiCorp GPG key
  ansible.builtin.shell: |
    curl -fsSL https://apt.releases.hashicorp.com/gpg | gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
  args:
    creates: /usr/share/keyrings/hashicorp-archive-keyring.gpg
  environment:
    https_proxy: "http://10.93.144.53:8080"

- name: Add HashiCorp apt repository
  ansible.builtin.shell: |
    echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" > /etc/apt/sources.list.d/hashicorp.list
  args:
    creates: /etc/apt/sources.list.d/hashicorp.list

- name: Install Terraform
  apt:
    name: terraform
    state: present
    update_cache: yes