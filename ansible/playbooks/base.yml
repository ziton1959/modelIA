---
- name: Base image configuration
  hosts: all
  become: true

  environment:
    http_proxy: "http://10.93.144.53:8080"
    https_proxy: "http://10.93.144.53:8080"
    no_proxy: "localhost,127.0.0.1"

  vars:
    packages: []

    # Per-OS-family package name translations.
    package_name_map:
      Debian:
        docker: docker.io
        python: python3
        python3: python3
        pip: python3-pip
        node: nodejs
        nodejs: nodejs
      RedHat:
        docker: docker
        python: python3
        python3: python3
        pip: python3-pip
        node: nodejs
        nodejs: nodejs

    # Packages that need a dedicated recipe (third-party repo setup)
    recipe_packages:
      - terraform
      - docker-ce
      - kubectl

  tasks:
    # ---- Proxy config (per family) ----
    - name: Configure apt proxy (Debian/Ubuntu)
      copy:
        dest: /etc/apt/apt.conf.d/00proxy
        content: |
          Acquire::http::Proxy "http://10.93.144.53:8080";
          Acquire::https::Proxy "http://10.93.144.53:8080";
      when: ansible_os_family == "Debian"

    - name: Configure dnf proxy (RedHat/Rocky)
      lineinfile:
        path: /etc/dnf/dnf.conf
        line: "proxy=http://10.93.144.53:8080"
        create: yes
      when: ansible_os_family == "RedHat"

    # ---- Split requested packages into recipe vs simple ----
    - name: Identify recipe packages
      set_fact:
        wanted_recipes: "{{ packages | map('lower') | select('in', recipe_packages) | list }}"
        simple_packages: "{{ packages | map('lower') | reject('in', recipe_packages) | list }}"
        final_simple: []

    - name: Translate simple package names for the OS family
      set_fact:
        final_simple: >-
          {{ final_simple +
             [package_name_map[ansible_os_family][item] | default(item)] }}
      loop: "{{ simple_packages }}"

    # ---- Debian/Ubuntu path (apt) ----
    - name: Update apt cache (Debian)
      apt:
        update_cache: yes
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    - name: Install base packages (Debian)
      apt:
        name:
          - curl
          - wget
          - git
          - unzip
          - vim
        state: present
      when: ansible_os_family == "Debian"

    # ---- Recipe packages (Debian): run each recipe file ----
    - name: Run recipes (Debian)
      include_tasks: "../recipes/{{ item }}.yml"
      loop: "{{ wanted_recipes }}"
      when: ansible_os_family == "Debian"

    # ---- Simple packages (Debian) ----
    - name: Install simple packages (Debian)
      apt:
        name: "{{ final_simple }}"
        state: present
        update_cache: yes
      when:
        - ansible_os_family == "Debian"
        - final_simple | length > 0

    - name: Clean apt cache (Debian)
      apt:
        autoclean: yes
        autoremove: yes
      when: ansible_os_family == "Debian"

    # ---- Rocky/RHEL path (dnf) ----
    - name: Install base packages (RedHat)
      dnf:
        name:
          - curl
          - wget
          - git
          - unzip
          - vim
        state: present
      when: ansible_os_family == "RedHat"

    - name: Install requested packages (RedHat)
      dnf:
        name: "{{ final_simple }}"
        state: present
      when:
        - ansible_os_family == "RedHat"
        - final_simple | length > 0

    - name: Clean dnf cache (RedHat)
      command: dnf clean all
      when: ansible_os_family == "RedHat"